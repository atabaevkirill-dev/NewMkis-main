[package]
name = "oncam-desktop"
version = "0.2.3"
description = "MKIS100TEST axis alignment workstation"
authors = ["ONCAM"]
edition = "2021"

[lib]
name = "oncam_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
retina = "0.4"
futures = "0.3"
url = "2"
tokio = { version = "1", features = ["time"] }
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"
socket2 = "0.6"
if-addrs = "0.15"

# keyring 3 has no default credential store: without a platform feature it silently
# falls back to an in-memory mock and passwords are never persisted.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

# retina 0.4.20 with one fix: a NAL body containing `00 00 00 xx` (Beward B102S pads key frames
# with zeros and stray bytes) drops the rest of that NAL instead of failing the RTSP session.
# See vendor/retina/MKIS100TEST.md.
[patch.crates-io]
retina = { path = "vendor/retina" }
