[LASER_RANGING]
# Default connection type (serial or tcp)
connection_type = serial

# Default serial port (will auto-detect available ports as well)
default_port = COM1

# Default baud rate (options: 9600, 57600, 115200)
default_baud = 115200

# TCP/IP settings
tcp_ip_address = 192.168.1.7
tcp_port = 20108

# Default ranging mode (single, continuous, stop)
default_mode = single

# Default target selection (first, last, multi)
default_target = first

# Default ranging frequency in Hz (1-10)
default_frequency = 1

# Default minimum and maximum gating distances in meters
min_gating_distance = 15
max_gating_distance = 4200

[UI_SETTINGS]
# Window geometry
window_width = 1000
window_height = 700
window_x = 100
window_y = 100

# Font settings
font_family = Arial
font_size = 12

[DEVICE_INFO]
# Device specifications
eye_safety_class = Class1/1M
wavelength = 1535±5nm
max_car_target = 3500
max_building_target = 4200
max_human_target = 2000
max_uav_target = 1000
min_range = 15
accuracy = ±1m
frequency_range = 1-10Hz
supply_voltage = 4.5-16V
weight = 32±1g
dimensions = 48×31×21mm
operating_temp = -40°C to +70°C