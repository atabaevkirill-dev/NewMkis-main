# Builds MKIS100TEST for Windows, macOS and Linux.
# Every push/PR: checks + installers as workflow artifacts.
# A tag like v0.1.0: the same installers are published on the GitHub Releases page.
name: MKIS100TEST

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_DEPS: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

jobs:
  check:
    name: Проверки
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - name: Системные зависимости Tauri
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
      - run: npm run check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Сборка · ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Системные зависимости Tauri
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_DEPS
      - uses: actions/setup-node@v7
        with:
          node-version-file: desktop/.nvmrc
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - run: npm ci
        working-directory: desktop
      - name: Сборка установщиков (и релиз для тега)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: ${{ matrix.args }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: MKIS100TEST ${{ github.ref_name }}
          releaseBody: |
            Windows: `MKIS100TEST_*_x64-setup.exe` (установщик), `*.msi`, `MKIS100TEST_*_x64-portable.exe` (без установки, нужен WebView2 — есть в Windows 10/11).
            macOS: `*.dmg`. Linux: `*.AppImage`, `*.deb`, `*.rpm`.
            Сборки не подписаны: Windows SmartScreen и macOS Gatekeeper покажут предупреждение при первом запуске.
          releaseDraft: false
          prerelease: false
      - name: Переносимый exe в релиз
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $portable = "MKIS100TEST_$('${{ github.ref_name }}'.TrimStart('v'))_x64-portable.exe"
          Copy-Item desktop/src-tauri/target/release/MKIS100TEST.exe $portable
          gh release upload "${{ github.ref_name }}" $portable --clobber
      - name: Сохранить сборку
        uses: actions/upload-artifact@v7
        with:
          name: MKIS100TEST-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/MKIS100TEST.exe
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
